name: Verify market
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test tests/*.test.mjs
